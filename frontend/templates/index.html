<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Baseball Draft Helper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Main Application -->
    <div id="app">
        <!-- Top Draft Status Bar -->
        <div class="draft-status-bar">
            <div class="draft-status-content">
                <div class="current-pick">
                    <span class="label">Current Pick:</span>
                    <span id="current-pick-team" class="team-name">-</span>
                    <span id="current-pick-round" class="round-info">Round -</span>
                </div>
                <div class="next-pick">
                    <span class="label">Next Up:</span>
                    <span id="next-pick-team" class="team-name">-</span>
                </div>
                <div class="recommended-player">
                    <span class="label">Recommended:</span>
                    <span id="recommended-player-name" class="player-name">-</span>
                    <span id="recommended-player-position" class="player-position-badge">-</span>
                </div>
                <div class="draft-progress">
                    <span id="draft-progress-text">Pick 0 of 0</span>
                </div>
                <div id="win-probability-display" class="win-probability-display">
                    <span class="label">Win Prob:</span>
                    <div class="win-prob-bar-container"><div class="win-prob-bar" style="width:0%"></div></div>
                    <span class="win-prob-pct">-</span>
                </div>
                <div class="draft-actions">
                    <select id="strategy-select" class="strategy-select" title="Draft Strategy">
                        <option value="balanced">Balanced</option>
                        <option value="stars_and_scrubs">Stars &amp; Scrubs</option>
                        <option value="pitching_heavy">Pitching Heavy</option>
                        <option value="hitting_heavy">Hitting Heavy</option>
                    </select>
                    <button id="auto-draft-toggle-btn" class="btn-small btn-auto-draft" title="Toggle Auto-Draft for Other Teams">Auto-Draft: OFF</button>
                    <button id="restart-draft-btn" class="btn-small btn-danger" title="Restart Draft - Clears All Picks">Restart Draft</button>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-layout">
            <!-- Left: Available Players -->
            <div class="panel available-players-panel">
                <div class="panel-header">
                    <h2>Available Players</h2>
                    <div class="search-controls">
                        <input type="text" id="player-search" placeholder="Search players..." class="search-input">
                        <select id="position-filter" class="position-filter">
                            <option value="">All Positions</option>
                            <option value="C">C</option>
                            <option value="1B">1B</option>
                            <option value="2B">2B</option>
                            <option value="3B">3B</option>
                            <option value="SS">SS</option>
                            <option value="MI">MI</option>
                            <option value="CI">CI</option>
                            <option value="OF">OF</option>
                            <option value="U">U</option>
                            <option value="SP">SP</option>
                            <option value="RP">RP</option>
                            <option value="P">P</option>
                        </select>
                    </div>
                </div>
                <div id="available-players-list" class="players-list"></div>
            </div>

            <!-- Center-Left: My Team -->
            <div class="panel my-team-panel">
                <div class="panel-header">
                    <h2 id="my-team-name-header">My Team</h2>
                </div>
                <div id="my-team-roster" class="team-roster">
                    <!-- Position slots will be generated here -->
                </div>
            </div>

            <!-- Center-Right: Recent Picks -->
            <div class="panel recent-picks-panel">
                <div class="panel-header">
                    <h2>Recent Picks</h2>
                </div>
                <div id="recent-picks-list" class="picks-list"></div>
            </div>

            <!-- Far Right: Other Teams -->
            <div class="panel other-teams-panel">
                <div class="panel-header">
                    <h2>Other Teams</h2>
                </div>
                <div id="other-teams-list" class="teams-list"></div>
            </div>
        </div>

        <!-- Bottom Panels: Leaderboard + Draft Board + Chart + Trade + Recap -->
        <div class="bottom-panels">
            <div class="bottom-tabs">
                <button class="bottom-tab active" data-tab="standings">Leaderboard</button>
                <button class="bottom-tab" data-tab="draftboard">Draft Board</button>
                <button class="bottom-tab" data-tab="chart">Category Rankings</button>
                <button class="bottom-tab" data-tab="trade">Trade</button>
                <button class="bottom-tab" data-tab="recap">Recap</button>
            </div>
            <div id="standings-panel" class="bottom-panel active">
                <div id="standings-content" class="standings-content">
                    <p class="muted-text">Draft some players to see standings…</p>
                </div>
            </div>
            <div id="draftboard-panel" class="bottom-panel">
                <div id="draftboard-content" class="draftboard-content">
                    <p class="muted-text">Draft picks will appear here…</p>
                </div>
            </div>
            <div id="chart-panel" class="bottom-panel">
                <div id="chart-content" class="chart-content">
                    <div class="cat-rank-header">
                        <select id="category-rank-select" class="position-filter">
                            <optgroup label="Batting">
                                <option value="HR" selected>HR</option>
                                <option value="OBP">OBP</option>
                                <option value="R">R</option>
                                <option value="RBI">RBI</option>
                                <option value="SB">SB</option>
                            </optgroup>
                            <optgroup label="Pitching">
                                <option value="ERA">ERA</option>
                                <option value="K">K</option>
                                <option value="SHOLDS">SHOLDS</option>
                                <option value="WHIP">WHIP</option>
                                <option value="WQS">WQS</option>
                            </optgroup>
                        </select>
                    </div>
                    <div id="cat-rank-table"></div>
                </div>
            </div>
            <div id="trade-panel" class="bottom-panel">
                <div id="trade-content" class="trade-content">
                    <p class="muted-text">Trade analyzer loading…</p>
                </div>
            </div>
            <div id="recap-panel" class="bottom-panel">
                <div id="recap-content" class="recap-content">
                    <p class="muted-text">Draft recap loading…</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        document.querySelectorAll('.bottom-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.bottom-tab').forEach(function(t) { t.classList.remove('active'); });
                document.querySelectorAll('.bottom-panel').forEach(function(p) { p.classList.remove('active'); });
                tab.classList.add('active');
                var panel = document.getElementById(tab.getAttribute('data-tab') + '-panel');
                if (panel) panel.classList.add('active');
            });
        });
    </script>
</body>
</html>
